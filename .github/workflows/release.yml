# Tag vX.Y.Z → the packages CI built for the tagged commit, published.
#
# Nothing is tested or compiled here. The push of the tag ran `ci.yml` on the
# same commit, which built the IDE's two packages and every extension,
# verified them and kept them as the artifact `luros-<sha>`. The tag publishes
# that artifact, and only once that run has succeeded. What ships is the file
# CI verified, not a second build of the same commit. `make harness` is run on
# a Mac before a tag: it is not part of this gate.
#
# The commit says its version (`make set-version`, the release notes, then
# the tag), and the IDE's packages CI built are named for it: when they are
# not named for the tag, nothing is published. The release carries exactly
# one roothide and one rootless package, the assembler's
# corresponding-source archive beside them (it is GPL-2.0), and
# `SHA256SUMS` — the extensions, the templates and the dSYMs stay in CI's
# artifact, because the app carries the first two inside itself.
#
# `push: tags` starts CI on the same commit, and the tag usually arrives with
# the branch, so the run may not exist yet when this starts, and it is waited
# for. A commit that never reached CI has no run: dispatch CI on the tag
# (`gh workflow run ci.yml --ref vX.Y.Z`), which is also the way back once the
# artifact is past its thirty days, and re-run this.

name: Release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      # The newest run on the commit that a push or a dispatch started; a pull
      # request's run names its packages for the merge commit, not this one.
      - name: Wait for CI on the tagged commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=""
          for _ in $(seq 30); do
            run="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json databaseId,event \
              --jq '[.[] | select(.event != "pull_request")][0].databaseId // empty')"
            [ -n "$run" ] && break
            sleep 20
          done
          if [ -z "$run" ]; then
            echo "::error::CI has not run on $GITHUB_SHA: the tag should have started it; dispatch CI on this commit, then re-run this"
            exit 1
          fi
          echo "CI run $run on $GITHUB_SHA"
          gh run watch "$run" --interval 30 > /dev/null
          conclusion="$(gh run view "$run" --json conclusion --jq .conclusion)"
          if [ "$conclusion" != success ]; then
            echo "::error::CI run $run ended $conclusion: nothing is published"
            exit 1
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: luros-${{ github.sha }}
          path: build/Packages/
          run-id: ${{ steps.ci.outputs.run }}
          github-token: ${{ github.token }}
      # CI's list proves the transfer. The release's own list is written for
      # exactly the files it carries (the IDE's named for the tag, each
      # extension's for its own version), and a missing one fails here.
      - name: Verify the packages and write the release checksums
        working-directory: build/Packages
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          version="${GITHUB_REF_NAME#v}"
          # one <glob>: the single file matching it, or an error.
          one() {
            local matches=($1)
            if [ "${#matches[@]}" -ne 1 ] || [ ! -f "${matches[0]}" ]; then
              echo "::error::expected exactly one $1 in CI's packages, found: ${matches[*]}" >&2
              exit 1
            fi
            echo "${matches[0]}"
          }
          files=("com.fluoxetine.luros_${version}_iphoneos-arm64e.deb"
                 "com.fluoxetine.luros_${version}_iphoneos-arm64.deb")
          # The development extensions, the templates and the dSYMs stay in
          # CI's artifact: the app carries the extensions and the templates
          # inside itself, so no reader installs them, and a symbolication uses
          # the build's own dSYM. What the release keeps beside the two
          # packages is the assembler's corresponding source — Keystone is
          # GPLv2 and its binary ships inside the app — and SHA256SUMS.
          assembler="$(one "com.fluoxetine.luros.agent-tools.assembler_*_iphoneos-arm64.deb")"
          assembler_version="${assembler#com.fluoxetine.luros.agent-tools.assembler_}"
          assembler_version="${assembler_version%_iphoneos-arm64.deb}"
          files+=("$(one "com.fluoxetine.luros.agent-tools.assembler_${assembler_version}_source.tar.xz")")
          for file in "${files[@]}"; do
            [ -f "$file" ] || { echo "::error::$file is missing from CI's packages"; exit 1; }
          done
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          # The publish step uploads this list, the IDE's debs first.
          printf 'build/Packages/%s\n' "${files[@]}" SHA256SUMS > "$RUNNER_TEMP/luros-release-files"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/luros-release.md"
          if [ -f "Documents/Releases/$version.md" ]; then
            cp "Documents/Releases/$version.md" "$notes"
          else
            cat > "$notes" <<NOTES
          Luros $version, for roothide and for rootless (/var/jb) bootstraps,
          with its development and agent tool extensions.

          SHA-256 sums are in \`SHA256SUMS\`.
          NOTES
          fi
          mapfile -t files < "$RUNNER_TEMP/luros-release-files"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber "${files[@]}"
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Luros $version" --notes-file "$notes" "${files[@]}"
          fi
