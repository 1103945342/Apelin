# A package to try on a device, started by hand: one bootstrap, the host
# tests skipped. What it builds is published as a GitHub release, which the
# Pages site turns into the package source a device updates from — so one run
# is a build, a release and a Sileo update. Set `publish` off to build only.
name: Debug build

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: The bootstrap to package for
        type: choice
        options:
          - roothide
          - rootless
        default: roothide
      publish:
        description: Publish the package as a release when the build passes
        type: boolean
        default: true

permissions:
  contents: write
  # A failed build writes the end of its log into an issue, which is the one
  # place this fork can read a log back without a GitHub sign-in.
  issues: write

jobs:
  build:
    name: Package for ${{ inputs.bootstrap }}
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          echo "iPhoneOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          formulae=()
          command -v dpkg-deb >/dev/null 2>&1 || formulae+=(dpkg)
          command -v ldid >/dev/null 2>&1 || formulae+=(ldid)
          if (( ${#formulae[@]} > 0 )); then
            brew install "${formulae[@]}"
          fi

      # `make deb` builds and packages the IDE and its daemon for one
      # bootstrap; the development extensions are left to CI's deb-all.
      - name: Build and package the IDE
        shell: bash
        run: |
          set -euo pipefail
          make deb FLAVOR="${{ inputs.bootstrap }}" CONFIGURATION=Release SKIP_HARNESS=1 \
            DERIVED_DATA="$RUNNER_TEMP/apelin-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            BUILD_NUMBER="$GITHUB_RUN_NUMBER" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Report a failed build
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/failure.md"
          {
            echo "The debug build of \`$GITHUB_SHA\` for ${{ inputs.bootstrap }} failed."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            tail -c 40000 "$RUNNER_TEMP/build.log" 2>/dev/null | grep -v '^##\[debug\]' || true
            echo '```'
          } > "$body"
          gh issue create \
            --title "Debug build failed: ${GITHUB_SHA:0:8} (${{ inputs.bootstrap }})" \
            --body-file "$body" || true

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: apelin-debug-${{ inputs.bootstrap }}-${{ github.sha }}
          path: build/Packages/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*//p' Configuration/Version.xcconfig | tr -d '[:space:]')"
          if [[ -z "$version" ]]; then
            echo "::error::Configuration/Version.xcconfig names no MARKETING_VERSION"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Is it published already?
        id: lookup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "::notice::${{ steps.version.outputs.tag }} is published already; nothing to do"
            echo "published=1" >> "$GITHUB_OUTPUT"
          else
            echo "published=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Take the package this run built
        if: steps.lookup.outputs.published == '0'
        uses: actions/download-artifact@v4
        with:
          name: apelin-debug-${{ inputs.bootstrap }}-${{ github.sha }}
          path: build/Packages/

      - name: Publish
        if: steps.lookup.outputs.published == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd build/Packages
          if [[ -z "$(ls ./*.deb 2>/dev/null)" ]]; then
            echo "::error::this run wrote no deb to publish"
            exit 1
          fi
          shasum -a 256 ./*.deb > SHA256SUMS
          cat SHA256SUMS
          notes="$RUNNER_TEMP/apelin-release.md"
          if [[ -f "$GITHUB_WORKSPACE/Documents/Releases/$VERSION.md" ]]; then
            cp "$GITHUB_WORKSPACE/Documents/Releases/$VERSION.md" "$notes"
          else
            echo "::warning::Documents/Releases/$VERSION.md is missing; the generic notes go out instead"
            printf 'Apelin %s, from the build of %s.\n\nSHA-256 sums are in `SHA256SUMS`.\n' \
              "$VERSION" "$GITHUB_SHA" > "$notes"
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Apelin $VERSION" \
            --notes-file "$notes" \
            ./*.deb SHA256SUMS
