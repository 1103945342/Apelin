# A push to main, and a manual run, build the package and keep it as this
# run's artifact. Nothing is published here: a release is made only from a tag,
# by `release.yml`, from the bytes `CI` built and verified for that commit.
name: Debug build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: The bootstrap to package for
        type: choice
        options:
          - roothide
          - rootless
        default: roothide

permissions:
  contents: read
  issues: write

jobs:
  build-and-publish:
    name: Build and publish ${{ github.event.inputs.bootstrap || 'roothide' }}
    runs-on: xcode-27
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          echo "iPhoneOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          formulae=()
          command -v dpkg-deb >/dev/null 2>&1 || formulae+=(dpkg)
          command -v ldid >/dev/null 2>&1 || formulae+=(ldid)
          if (( ${#formulae[@]} > 0 )); then
            brew install "${formulae[@]}"
          fi

      # The system prompt is edited as Markdown: the Swift it compiles to is
      # written here from it, before the build, and on a push to main a change
      # is committed and pushed back so the repository holds it too.
      - name: Regenerate the system prompt
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: Packages/LurosAgent/Scripts/sync-prompts.sh

      - name: Restore SwiftPM cache
        uses: actions/cache@v4
        with:
          # Xcode keeps its clones in the derived data folder it is given,
          # and `collect-licenses` reads them from there: the cache follows
          # that path rather than moving the clones somewhere the build's
          # license step cannot find them.
          path: ${{ runner.temp }}/luros-${{ github.run_id }}-${{ github.run_attempt }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Luros.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve package dependencies
        shell: bash
        env:
          DERIVED_DATA: ${{ runner.temp }}/luros-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -uo pipefail
          # Resolving on its own first, so a dependency failure names its
          # cause here instead of surfacing as a bare "Could not resolve
          # package dependencies" in the middle of the build. The same derived
          # data the build uses, since that is where the clones belong. The
          # full log goes to the step summary, which a run keeps.
          mkdir -p "$DERIVED_DATA"
          status=0
          xcodebuild -resolvePackageDependencies \
              -derivedDataPath "$DERIVED_DATA" \
              -project Luros.xcodeproj -scheme Luros >resolve.log 2>&1 || status=$?
          if [[ "$status" -eq 0 ]]; then
            tail -n 20 resolve.log
            exit 0
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 resolve.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "::error::resolving package dependencies failed (exit $status)"
          tail -n 60 resolve.log
          exit "$status"

      - name: Keep the resolve log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resolve-log-${{ github.sha }}
          path: resolve.log
          if-no-files-found: warn
          retention-days: 7

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          make deb FLAVOR="${{ github.event.inputs.bootstrap || 'roothide' }}" CONFIGURATION=Release SKIP_HARNESS=1 \
            DERIVED_DATA="$RUNNER_TEMP/luros-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            BUILD_NUMBER="$GITHUB_RUN_NUMBER" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: ${{ runner.temp }}/build.log
          if-no-files-found: warn
          retention-days: 7

      # A compiler error is a line the wrapper prints to stderr, which an
      # annotation keeps only as an exit status: the log itself is what names
      # the file, the line and the diagnostic.
      - name: Report the compiler errors
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/build.log"
          [[ -f "$log" ]] || exit 0
          { echo '```'; grep -E "error:" "$log" | head -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" "$log" | head -40 || true

      - name: Keep the package artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luros-${{ github.event.inputs.bootstrap || 'roothide' }}-${{ github.sha }}
          path: |
            build/Packages/*.deb
            build/Packages/SHA256SUMS
          if-no-files-found: ignore
          retention-days: 30

      - name: Report a failed build or publish
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          body="$RUNNER_TEMP/failure.md"
          {
            echo "The debug build of \`$GITHUB_SHA\` for ${{ github.event.inputs.bootstrap || 'roothide' }} failed."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            tail -c 40000 "$RUNNER_TEMP/build.log" 2>/dev/null | grep -v '^##\[debug\]' || true
            echo '```'
          } > "$body"
          gh issue create \
            --title "Debug build or publish failed: ${GITHUB_SHA:0:8} (${{ inputs.bootstrap }})" \
            --body-file "$body" > /dev/null 2>&1 || true
