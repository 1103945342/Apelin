# A push to main builds the package and keeps it as this run's artifact; only a
# manual run publishes it, so no commit can rewrite a release somebody has
# already installed. The manual run is otherwise the whole path: build the
# selected bootstrap, package it, and publish the exact .deb from that same job.
name: Debug build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: The bootstrap to package for
        type: choice
        options:
          - roothide
          - rootless
        default: roothide

permissions:
  contents: write
  issues: write

jobs:
  build-and-publish:
    name: Build and publish ${{ github.event.inputs.bootstrap || 'roothide' }}
    runs-on: xcode-27
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          echo "iPhoneOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          formulae=()
          command -v dpkg-deb >/dev/null 2>&1 || formulae+=(dpkg)
          command -v ldid >/dev/null 2>&1 || formulae+=(ldid)
          if (( ${#formulae[@]} > 0 )); then
            brew install "${formulae[@]}"
          fi

      # The system prompt is edited as Markdown: the Swift it compiles to is
      # written here from it, before the build, and on a push to main a change
      # is committed and pushed back so the repository holds it too.
      - name: Regenerate the system prompt
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: Packages/ApelinAgent/Scripts/sync-prompts.sh

      - name: Restore SwiftPM cache
        uses: actions/cache@v4
        with:
          # Xcode keeps its clones in the derived data folder it is given,
          # and `collect-licenses` reads them from there: the cache follows
          # that path rather than moving the clones somewhere the build's
          # license step cannot find them.
          path: ${{ runner.temp }}/apelin-${{ github.run_id }}-${{ github.run_attempt }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Apelin.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve package dependencies
        shell: bash
        env:
          DERIVED_DATA: ${{ runner.temp }}/apelin-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -uo pipefail
          # Resolving on its own first, so a dependency failure names its
          # cause here instead of surfacing as a bare "Could not resolve
          # package dependencies" in the middle of the build. The same derived
          # data the build uses, since that is where the clones belong. The
          # full log goes to the step summary, which a run keeps.
          mkdir -p "$DERIVED_DATA"
          status=0
          xcodebuild -resolvePackageDependencies \
              -derivedDataPath "$DERIVED_DATA" \
              -project Apelin.xcodeproj -scheme Apelin >resolve.log 2>&1 || status=$?
          if [[ "$status" -eq 0 ]]; then
            tail -n 20 resolve.log
            exit 0
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 resolve.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "::error::resolving package dependencies failed (exit $status)"
          tail -n 60 resolve.log
          exit "$status"

      - name: Keep the resolve log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resolve-log-${{ github.sha }}
          path: resolve.log
          if-no-files-found: warn
          retention-days: 7

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          make deb FLAVOR="${{ github.event.inputs.bootstrap || 'roothide' }}" CONFIGURATION=Release SKIP_HARNESS=1 \
            DERIVED_DATA="$RUNNER_TEMP/apelin-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            BUILD_NUMBER="$GITHUB_RUN_NUMBER" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: ${{ runner.temp }}/build.log
          if-no-files-found: warn
          retention-days: 7

      # A compiler error is a line the wrapper prints to stderr, which an
      # annotation keeps only as an exit status: the log itself is what names
      # the file, the line and the diagnostic.
      - name: Report the compiler errors
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/build.log"
          [[ -f "$log" ]] || exit 0
          { echo '```'; grep -E "error:" "$log" | head -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" "$log" | head -40 || true

      - name: Read version and prepare release files
        id: release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*//p' \
            Configuration/Version.xcconfig | tr -d '[:space:]')"
          if [[ -z "$version" ]]; then
            echo "::error::Configuration/Version.xcconfig names no MARKETING_VERSION"
            exit 1
          fi

          shopt -s nullglob
          packages=(build/Packages/*.deb)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::the build produced no .deb"
            exit 1
          fi
          (cd build/Packages && shasum -a 256 ./*.deb > SHA256SUMS)

          notes="$RUNNER_TEMP/apelin-release.md"
          if [[ -f "Documents/Releases/$version.md" ]]; then
            cp "Documents/Releases/$version.md" "$notes"
          else
            {
              printf 'Apelin %s from commit %s.\n\n' "$version" "$SHA"
              printf 'SHA-256 sums are included in `SHA256SUMS`.\n'
            } > "$notes"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "::notice::prepared ${#packages[@]} package(s) for v$version"

      - name: Create, upload and publish the release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          NOTES: ${{ steps.release.outputs.notes }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          api="repos/$GH_REPO/releases"
          rc=0
          existing="$(gh api "$api/tags/$TAG" 2>&1)" || rc=$?

          if [[ "$rc" == 0 ]]; then
            release_id="$(printf '%s' "$existing" | jq -r '.id // empty')"
            if [[ -z "$release_id" ]]; then
              echo "::error::GitHub returned a release without an id"
              exit 1
            fi
            echo "::notice::updating existing $TAG release"
          elif [[ "$rc" == 1 ]] && grep -q 'HTTP 404' <<<"$existing"; then
            rc=0
            created="$(gh api -X POST "$api" \
              -f tag_name="$TAG" \
              -f target_commitish="$SHA" \
              -f name="Apelin $VERSION" \
              -F "body=@$NOTES" \
              -F draft=true 2>&1)" || rc=$?
            if [[ "$rc" != 0 ]]; then
              echo "::error::creating the draft was refused (exit $rc): $(printf '%s' "$created" | tr '\n' ' ' | head -c 500)"
              exit 1
            fi
            release_id="$(printf '%s' "$created" | jq -r '.id // empty')"
            if [[ -z "$release_id" ]]; then
              echo "::error::GitHub created no release id"
              exit 1
            fi
            echo "::notice::created draft release $release_id"
          else
            echo "::error::looking up $TAG failed (exit $rc): $(printf '%s' "$existing" | tr '\n' ' ' | head -c 500)"
            exit 1
          fi

          shopt -s nullglob
          assets=(build/Packages/*.deb build/Packages/SHA256SUMS)
          if (( ${#assets[@]} < 2 )); then
            echo "::error::the package or SHA256SUMS is missing"
            exit 1
          fi

          rc=0
          uploaded="$(gh release upload "$TAG" "${assets[@]}" --clobber 2>&1)" || rc=$?
          if [[ "$rc" != 0 ]]; then
            echo "::error::uploading the packages was refused (exit $rc): $(printf '%s' "$uploaded" | tr '\n' ' ' | head -c 500)"
            exit 1
          fi
          echo "$uploaded"

          rc=0
          published="$(gh api -X PATCH "$api/$release_id" \
            -F draft=false \
            -f name="Apelin $VERSION" \
            -F "body=@$NOTES" 2>&1)" || rc=$?
          if [[ "$rc" != 0 ]]; then
            echo "::error::publishing the release was refused (exit $rc): $(printf '%s' "$published" | tr '\n' ' ' | head -c 500)"
            exit 1
          fi
          echo "::notice::published or updated $TAG with ${#assets[@]} asset(s)"

      - name: Keep the package artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apelin-${{ github.event.inputs.bootstrap || 'roothide' }}-${{ github.sha }}
          path: |
            build/Packages/*.deb
            build/Packages/SHA256SUMS
          if-no-files-found: ignore
          retention-days: 30

      - name: Report a failed build or publish
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          body="$RUNNER_TEMP/failure.md"
          {
            echo "The debug build or release of \`$GITHUB_SHA\` for ${{ github.event.inputs.bootstrap || 'roothide' }} failed."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            tail -c 40000 "$RUNNER_TEMP/build.log" 2>/dev/null | grep -v '^##\[debug\]' || true
            echo '```'
          } > "$body"
          gh issue create \
            --title "Debug build or publish failed: ${GITHUB_SHA:0:8} (${{ inputs.bootstrap }})" \
            --body-file "$body" > /dev/null 2>&1 || true
