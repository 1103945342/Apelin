# Temporary: rehearse ci.yml's publish step against the packages a finished
# CI run already built, then publish those very bytes. It exists because this
# fork's first release job failed at that step within a second and left no
# error in its annotations. Every command here is the one in ci.yml, with the
# failure of each reported as an annotation, since logs of this repository are
# not readable from where the pipeline is watched. Deleted once ci.yml's own
# step has run once.
name: Release dry run

on:
  push:
    paths:
      - .github/workflows/release-dry-run.yml

permissions:
  contents: write
  actions: read

env:
  BUILT_SHA: 50326d5a67cce92f839ff7c25ba1eab3b53651c6
  BUILT_RUN: "41355198848"

jobs:
  publish:
    name: Rehearse the publish and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*//p' Configuration/Version.xcconfig | tr -d '[:space:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "::notice::version read: $version"

      - name: Take the packages that run built
        uses: actions/download-artifact@v4
        with:
          name: apelin-${{ env.BUILT_SHA }}
          run-id: ${{ env.BUILT_RUN }}
          github-token: ${{ github.token }}
          path: build/Packages/

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd build/Packages
          echo "::notice::packages: $(ls -1 | tr '\n' ' ')"
          if ! out="$(sha256sum --check SHA256SUMS 2>&1)"; then
            echo "::error::checksum check: $(printf '%s' "$out" | tr '\n' '|' | head -c 900)"
            exit 1
          fi
          echo "$out"
          notes="$RUNNER_TEMP/apelin-release.md"
          if [ -f "../../Documents/Releases/$VERSION.md" ]; then
            cp "../../Documents/Releases/$VERSION.md" "$notes"
          else
            echo "::warning::Documents/Releases/$VERSION.md is missing; the generic notes go out instead"
            cat > "$notes" <<NOTES
          Apelin $VERSION, for roothide and for rootless (/var/jb) bootstraps,
          with its development and agent tool extensions.

          SHA-256 sums are in \`SHA256SUMS\`.
          NOTES
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            if ! out="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                  -f ref="refs/tags/$TAG" -f sha="$BUILT_SHA" 2>&1)"; then
              echo "::error::tag creation: $(printf '%s' "$out" | tr '\n' '|' | head -c 900)"
              exit 1
            fi
            echo "::notice::tag created: $out"
          fi
          if ! out="$(gh release create "$TAG" --verify-tag --title "Apelin $VERSION" \
                --notes-file "$notes" \
                ./*.deb ./*_source.tar.xz ./*_dSYMs.zip ./*_Templates.tar.zst ./SHA256SUMS 2>&1)"; then
            echo "::error::gh release create: $(printf '%s' "$out" | tr '\n' '|' | head -c 900)"
            exit 1
          fi
          echo "::notice::published: $out"
