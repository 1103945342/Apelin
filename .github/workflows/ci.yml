# Pushes and pull requests test on the host and build both package layouts
# in parallel. After both pass, a main-branch push publishes an unpublished
# version from that run's artifact, never from a second build. release.yml
# remains the publisher for tags pushed by hand.
name: CI

on:
  # Automatic runs are off (2026-11-02, owner): a push no longer starts the
  # whole chain. `Debug build` packages one bootstrap, `Publish release`
  # publishes a finished build, and this workflow stays for the day the
  # release pipeline is wanted back.
  workflow_dispatch:

permissions:
  contents: read

# A pull request's new push cancels the run of its old one. A push to
# main keeps its own run however soon the next one follows, since a tag
# on that commit publishes what the run built.
concurrency:
  group: apelin-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"

# Both jobs run on the Xcode 27 image, the one with the iOS 27.1 SDK the
# packages are linked against (`IOS_SDK_TIER` in the Makefile: the tier an
# iPhone Duo runs edge to edge, with vertical bars). Its default Xcode may be
# newer than 27.1, so 27.1 is named rather than the newest found.
jobs:
  # Preserve ordinary pushes for tagged releases. Only an explicitly marked
  # restart cancels older CI runs; it finishes cancelling before compiling.
  prepare:
    name: Prepare requested CI restart
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel previous CI runs when a restart was requested
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[restart-ci]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          runs="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&per_page=100" \
            --jq ".workflow_runs[] | select(.id < $GITHUB_RUN_ID and .status != \"completed\") | .id")"
          if [ -z "$runs" ]; then
            echo "::notice::No previous CI runs remain active"
            exit 0
          fi
          while IFS= read -r run; do
            if ! output="$(gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/cancel" 2>&1)"; then
              status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)"
              if [ "$status" != completed ]; then
                echo "::error::Cannot cancel CI $run: $output"
                exit 1
              fi
            fi
            status=""
            for attempt in $(seq 30); do
              status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)"
              [ "$status" = completed ] && break
              sleep 2
            done
            if [ "$status" != completed ]; then
              echo "::error::CI $run has not stopped; refusing to start another build"
              exit 1
            fi
            echo "::notice::Previous CI $run stopped"
          done <<< "$runs"

  # Seconds, where the build takes minutes, so a broken host test says so
  # long before the packages would.
  test:
    name: Host tests
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          echo "iPhoneOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Run host tests
        run: make harness SWIFTPM_SCRATCH="$RUNNER_TEMP/apelin-spm"

  build:
    name: Build and verify Debian packages
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - name: Configure build paths
        shell: bash
        run: |
          set -euo pipefail
          echo "DERIVED_DATA=$RUNNER_TEMP/apelin-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          echo "iPhoneOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          formulae=()
          command -v dpkg-deb >/dev/null 2>&1 || formulae+=(dpkg)
          command -v ldid >/dev/null 2>&1 || formulae+=(ldid)
          command -v zstd >/dev/null 2>&1 || formulae+=(zstd)
          if (( ${#formulae[@]} > 0 )); then
            brew install "${formulae[@]}"
          fi

      # The harness runs in the job beside this one. deb-all packages the IDE
      # for both flavours, then every extension: the development extensions
      # (their templates built with the iPhoneOS SDK first) and the agent
      # tool extensions, each read back and verified.
      - name: Build, package and verify the IDE and every extension
        run: make deb-all CONFIGURATION=Release SKIP_HARNESS=1 DERIVED_DATA="$DERIVED_DATA" BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      # Both flavours package the one build, and neither strip nor ldid touches
      # LC_UUID, so one set of dSYMs matches every shipped binary.
      - name: Archive dSYMs
        shell: bash
        run: |
          set -euo pipefail
          version="$(make --no-print-directory print-version)"
          cd "$DERIVED_DATA/Build/Products/Release-iphoneos"
          zip -qry "$GITHUB_WORKSPACE/build/Packages/Apelin_${version}_dSYMs.zip" ./*.dSYM

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd build/Packages
          shasum -a 256 ./*.deb ./*_source.tar.xz ./*_dSYMs.zip ./*_Templates.tar.zst > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: apelin-${{ github.sha }}
          path: |
            build/Packages/*.deb
            build/Packages/*_source.tar.xz
            build/Packages/*_dSYMs.zip
            build/Packages/*_Templates.tar.zst
            build/Packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # A push is a release. This runs only once both jobs above have passed, and
  # publishes what they built: the artifact, never a second build. The version
  # in Configuration/Version.xcconfig names it, so a push that carries an
  # already published version publishes nothing, and `make set-version
  # VERSION=x.y.z` followed by a push publishes a new one. The tag it creates
  # names the commit the run built; release.yml still publishes a tag pushed by
  # hand, and its own verification covers the archive that pushes.
  #
  # A run started by hand on main publishes the same way (2026-11-02): GitHub
  # stopped creating runs for this fork's pushes while its settings said they
  # were allowed, and a dispatch was the only way left to build a version.
  release:
    name: Publish the release
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*//p' Configuration/Version.xcconfig | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "::error::Configuration/Version.xcconfig names no MARKETING_VERSION"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Is the version published already?
        id: lookup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "${{ steps.version.outputs.tag }} is published already; nothing to publish"
            echo "published=1" >> "$GITHUB_OUTPUT"
          else
            echo "published=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Take the packages this run built
        if: steps.lookup.outputs.published == '0'
        uses: actions/download-artifact@v4
        with:
          name: apelin-${{ github.sha }}
          path: build/Packages/

      - name: Publish
        if: steps.lookup.outputs.published == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd build/Packages
          if ! out="$(sha256sum --check SHA256SUMS 2>&1)"; then
            echo "::error::checksum check: $(printf '%s' "$out" | tr '\n' '|' | head -c 900)"
            exit 1
          fi
          echo "$out"
          notes="$RUNNER_TEMP/apelin-release.md"
          if [ -f "../../Documents/Releases/$VERSION.md" ]; then
            cp "../../Documents/Releases/$VERSION.md" "$notes"
          else
            echo "::warning::Documents/Releases/$VERSION.md is missing; the generic notes go out instead"
            cat > "$notes" <<NOTES
          Apelin $VERSION, for roothide and for rootless (/var/jb) bootstraps,
          with its development and agent tool extensions.

          SHA-256 sums are in \`SHA256SUMS\`.
          NOTES
          fi
          # The release API creates the tag at this exact commit. A separate
          # git/refs call is forbidden for this fork's GITHUB_TOKEN.
          # Each failure says why in an annotation: the run's log is not the
          # only place a maintainer reads.
          if ! out="$(gh release create "$TAG" --target "$GITHUB_SHA" \
                --title "Apelin $VERSION" \
                --notes-file "$notes" \
                ./*.deb ./*_source.tar.xz ./*_dSYMs.zip ./*_Templates.tar.zst ./SHA256SUMS 2>&1)"; then
            echo "::error::gh release create: $(printf '%s' "$out" | tr '\n' '|' | head -c 900)"
            exit 1
          fi
          echo "$out"
