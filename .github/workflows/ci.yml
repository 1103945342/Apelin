# A tag builds both package layouts, in parallel with the tests, and keeps
# them as this run's artifact. `release.yml` waits for this run on the tagged
# commit and publishes exactly those bytes — never a second build. A branch
# push starts nothing; `Debug build` packages main for trying out.
name: CI

on:
  # A tag is the only thing that publishes, and this is the build it
  # publishes: `release.yml` waits for this run on the tagged commit and
  # uploads exactly the packages it made. A branch push builds nothing
  # (`Debug build` does that on main); a manual run still builds both
  # layouts, and publishes nothing.
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

# A pull request's new push cancels the run of its old one. A tag's run and a
# manual one are keyed by their ref and commit, so a tag never cancels the run
# whose packages it is about to publish.
concurrency:
  group: luros-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"

# Both jobs run on the Xcode 27 image, the one with the iOS 27.1 SDK the
# packages are linked against (`IOS_SDK_TIER` in the Makefile: the tier an
# iPhone Duo runs edge to edge, with vertical bars). Its default Xcode may be
# newer than 27.1, so 27.1 is named rather than the newest found.
jobs:
  # Preserve ordinary pushes for tagged releases. Only an explicitly marked
  # restart cancels older CI runs; it finishes cancelling before compiling.
  prepare:
    name: Prepare requested CI restart
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel previous CI runs when a restart was requested
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[restart-ci]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          runs="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&per_page=100" \
            --jq ".workflow_runs[] | select(.id < $GITHUB_RUN_ID and .status != \"completed\") | .id")"
          if [ -z "$runs" ]; then
            echo "::notice::No previous CI runs remain active"
            exit 0
          fi
          while IFS= read -r run; do
            if ! output="$(gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/cancel" 2>&1)"; then
              status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)"
              if [ "$status" != completed ]; then
                echo "::error::Cannot cancel CI $run: $output"
                exit 1
              fi
            fi
            status=""
            for attempt in $(seq 30); do
              status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)"
              [ "$status" = completed ] && break
              sleep 2
            done
            if [ "$status" != completed ]; then
              echo "::error::CI $run has not stopped; refusing to start another build"
              exit 1
            fi
            echo "::notice::Previous CI $run stopped"
          done <<< "$runs"

  # Seconds, where the build takes minutes, so a broken host test says so
  # long before the packages would.
  test:
    name: Host tests
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          echo "iPhoneOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Regenerate the system prompt
        shell: bash
        run: Packages/LurosAgent/Scripts/sync-prompts.sh

      - name: Run host tests
        run: make harness SWIFTPM_SCRATCH="$RUNNER_TEMP/luros-spm"

  build:
    name: Build and verify Debian packages
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - name: Configure build paths
        shell: bash
        run: |
          set -euo pipefail
          echo "DERIVED_DATA=$RUNNER_TEMP/luros-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          echo "iPhoneOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          formulae=()
          command -v dpkg-deb >/dev/null 2>&1 || formulae+=(dpkg)
          command -v ldid >/dev/null 2>&1 || formulae+=(ldid)
          command -v zstd >/dev/null 2>&1 || formulae+=(zstd)
          if (( ${#formulae[@]} > 0 )); then
            brew install "${formulae[@]}"
          fi

      - name: Regenerate the system prompt
        shell: bash
        run: Packages/LurosAgent/Scripts/sync-prompts.sh

      # The harness runs in the job beside this one. deb-all packages the IDE
      # for both flavours, then every extension: the development extensions
      # (their templates built with the iPhoneOS SDK first) and the agent
      # tool extensions, each read back and verified.
      - name: Build, package and verify the IDE and every extension
        run: make deb-all CONFIGURATION=Release SKIP_HARNESS=1 DERIVED_DATA="$DERIVED_DATA" BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      # Both flavours package the one build, and neither strip nor ldid touches
      # LC_UUID, so one set of dSYMs matches every shipped binary.
      - name: Archive dSYMs
        shell: bash
        run: |
          set -euo pipefail
          version="$(make --no-print-directory print-version)"
          cd "$DERIVED_DATA/Build/Products/Release-iphoneos"
          zip -qry "$GITHUB_WORKSPACE/build/Packages/Luros_${version}_dSYMs.zip" ./*.dSYM

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd build/Packages
          shasum -a 256 ./*.deb ./*_source.tar.xz ./*_dSYMs.zip ./*_Templates.tar.zst > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: luros-${{ github.sha }}
          path: |
            build/Packages/*.deb
            build/Packages/*_source.tar.xz
            build/Packages/*_dSYMs.zip
            build/Packages/*_Templates.tar.zst
            build/Packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
